{% extends 'base.html' %}
{% block title %}Kirish — BizNews{% endblock %}
{% block content %}
<style>
    .auth-wrapper { min-height: 80vh; display: flex; align-items: center; background: #f8f9fa; padding: 40px 0; }
    .auth-card { background: #fff; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,.1); padding: 48px 40px; max-width: 440px; width: 100%; margin: 0 auto; }
    .auth-logo { text-align: center; margin-bottom: 8px; }
    .auth-logo h2 { font-size: 32px; font-weight: 800; letter-spacing: 1px; }
    .auth-title { text-align: center; font-size: 20px; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
    .auth-sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 28px; }
    .auth-card .form-control { height: 48px; border-radius: 8px; font-size: 14px; border: 1.5px solid #e0e0e0; transition: border .2s; }
    .auth-card .form-control:focus { border-color: #007bff; box-shadow: none; }
    .auth-card label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #555; margin-bottom: 5px; }
    .auth-card .input-group-text { background: #f4f6f9; border: 1.5px solid #e0e0e0; border-right: none; height: 48px; }
    .auth-card .input-group .form-control { border-left: none; }
    .auth-card .input-group-append .btn { height: 48px; border: 1.5px solid #e0e0e0; border-left: none; background: #f4f6f9; color: #555; }
    .btn-auth { height: 50px; font-weight: 700; font-size: 15px; border-radius: 8px; letter-spacing: .5px; }
    .auth-divider { text-align: center; color: #aaa; font-size: 13px; margin: 20px 0; position: relative; }
    .auth-divider::before, .auth-divider::after { content:''; position:absolute; top:50%; width:43%; height:1px; background:#e9ecef; }
    .auth-divider::before { left:0; }
    .auth-divider::after { right:0; }
    .auth-footer-link { text-align: center; font-size: 13px; margin-top: 16px; }
</style>

<div class="auth-wrapper">
    <div class="container">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="{% url 'home' %}">
                    <h2 class="text-primary">Biz<span class="text-secondary font-weight-normal">News</span></h2>
                </a>
            </div>
            <div class="auth-title">Tizimga kirish</div>
            <div class="auth-sub">Xush kelibsiz! Hisobingizga kiring.</div>

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Foydalanuvchi nomi</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa fa-user text-primary"></i></span>
                        </div>
                        <input type="text" name="username" class="form-control"
                               placeholder="username" required autofocus
                               value="{{ request.POST.username }}">
                    </div>
                </div>
                <div class="form-group">
                    <label>Parol</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa fa-lock text-primary"></i></span>
                        </div>
                        <input type="password" name="password" id="pwd"
                               class="form-control" placeholder="••••••••" required>
                        <div class="input-group-append">
                            <button type="button" class="btn" onclick="togglePwd('pwd','ico')">
                                <i class="fa fa-eye" id="ico"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="text-right mb-3">
                    <a href="{% url 'new_password' %}" style="font-size:13px;color:#007bff;">
                        Parolni unutdingizmi?
                    </a>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-auth">
                    <i class="fa fa-sign-in-alt mr-2"></i>Kirish
                </button>
            </form>

            <div class="auth-divider">yoki</div>
            <div class="auth-footer-link">
                Hisobingiz yo'qmi?
                <a href="{% url 'register' %}" class="text-primary font-weight-bold">Ro'yxatdan o'ting</a>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
function togglePwd(id, ico) {
    const i = document.getElementById(id);
    const e = document.getElementById(ico);
    i.type = i.type === 'password' ? 'text' : 'password';
    e.className = i.type === 'text' ? 'fa fa-eye-slash' : 'fa fa-eye';
}
</script>
{% endblock %}
{% endblock %}
