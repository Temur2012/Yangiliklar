{% extends 'base.html' %}
{% block title %}Ro'yxatdan o'tish — BizNews{% endblock %}
{% block content %}
<style>
    .auth-wrapper { background: #f8f9fa; padding: 40px 0; }
    .auth-card { background: #fff; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,.1); padding: 44px 40px; max-width: 520px; width: 100%; margin: 0 auto; }
    .auth-logo { text-align: center; margin-bottom: 8px; }
    .auth-logo h2 { font-size: 32px; font-weight: 800; }
    .auth-title { text-align: center; font-size: 20px; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
    .auth-sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 28px; }
    .auth-card .form-control { height: 46px; border-radius: 8px; font-size: 14px; border: 1.5px solid #e0e0e0; }
    .auth-card .form-control:focus { border-color: #007bff; box-shadow: none; }
    .auth-card label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #555; margin-bottom: 4px; }
    .auth-card .input-group-text { background: #f4f6f9; border: 1.5px solid #e0e0e0; border-right: none; height: 46px; }
    .auth-card .input-group .form-control { border-left: none; }
    .btn-auth { height: 50px; font-weight: 700; font-size: 15px; border-radius: 8px; }
    .strength-bar { height: 5px; border-radius: 3px; transition: all .3s; }
    .auth-footer-link { text-align: center; font-size: 13px; margin-top: 16px; }
</style>

<div class="auth-wrapper">
    <div class="container">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="{% url 'home' %}">
                    <h2 class="text-primary">Biz<span class="text-secondary font-weight-normal">News</span></h2>
                </a>
            </div>
            <div class="auth-title">Ro'yxatdan o'tish</div>
            <div class="auth-sub">Yangi hisob yarating.</div>

            <form method="post">
                {% csrf_token %}
                <div class="form-row">
                    <div class="form-group col-6">
                        <label>Ism</label>
                        <input type="text" name="first_name" class="form-control"
                               placeholder="Ismingiz" value="{{ request.POST.first_name }}">
                    </div>
                    <div class="form-group col-6">
                        <label>Familiya</label>
                        <input type="text" name="last_name" class="form-control"
                               placeholder="Familiyangiz" value="{{ request.POST.last_name }}">
                    </div>
                </div>

                <div class="form-group">
                    <label>Foydalanuvchi nomi <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa fa-user text-primary"></i></span>
                        </div>
                        <input type="text" name="username" class="form-control"
                               placeholder="username" required autofocus
                               value="{{ request.POST.username }}">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa fa-envelope text-primary"></i></span>
                        </div>
                        <input type="email" name="email" class="form-control"
                               placeholder="email@example.com" value="{{ request.POST.email }}">
                    </div>
                </div>

                <div class="form-group">
                    <label>Parol <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa fa-lock text-primary"></i></span>
                        </div>
                        <input type="password" name="password1" id="pw1"
                               class="form-control" placeholder="Kamida 6 ta belgi"
                               required oninput="strength(this.value)">
                    </div>
                    <div class="progress mt-1" style="height:5px;">
                        <div id="sBar" class="progress-bar strength-bar" style="width:0%"></div>
                    </div>
                    <small id="sText" class="text-muted"></small>
                </div>

                <div class="form-group">
                    <label>Parolni tasdiqlang <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa fa-lock text-primary"></i></span>
                        </div>
                        <input type="password" name="password2" id="pw2"
                               class="form-control" placeholder="Qayta kiriting"
                               required oninput="match()">
                    </div>
                    <small id="mText"></small>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-auth mt-2">
                    <i class="fa fa-user-plus mr-2"></i>Ro'yxatdan o'tish
                </button>
            </form>

            <div class="auth-footer-link mt-3">
                Hisobingiz bormi?
                <a href="{% url 'login' %}" class="text-primary font-weight-bold">Kirish</a>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
function strength(v) {
    let s = 0;
    if (v.length >= 6) s++;
    if (v.length >= 10) s++;
    if (/[A-Z]/.test(v)) s++;
    if (/[0-9]/.test(v)) s++;
    if (/[^A-Za-z0-9]/.test(v)) s++;
    const lvl = [
        {w:'20%',c:'bg-danger',t:'Juda zaif'},
        {w:'40%',c:'bg-warning',t:'Zaif'},
        {w:'60%',c:'bg-info',t:"O'rtacha"},
        {w:'80%',c:'bg-primary',t:'Yaxshi'},
        {w:'100%',c:'bg-success',t:'Kuchli'},
    ];
    const l = lvl[Math.min(s-1,4)] || lvl[0];
    const b = document.getElementById('sBar');
    b.style.width = l.w; b.className = 'progress-bar strength-bar ' + l.c;
    document.getElementById('sText').textContent = v.length ? l.t : '';
}
function match() {
    const ok = document.getElementById('pw1').value === document.getElementById('pw2').value;
    const el = document.getElementById('mText');
    el.textContent = document.getElementById('pw2').value ? (ok ? '✔ Mos' : '✘ Mos emas') : '';
    el.className = ok ? 'text-success' : 'text-danger';
}
</script>
{% endblock %}
{% endblock %}
