{% extends 'base.html' %}
{% block title %}Parol o'zgartirish — BizNews{% endblock %}
{% block content %}
<style>
    .auth-wrapper { background: #f8f9fa; padding: 60px 0; }
    .auth-card { background: #fff; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,.1); padding: 48px 40px; max-width: 440px; margin: 0 auto; }
    .auth-icon { text-align: center; margin-bottom: 16px; }
    .auth-icon .icon-circle { width: 72px; height: 72px; background: linear-gradient(135deg,#fff3cd,#ffc107); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; color: #856404; }
    .auth-title { text-align: center; font-size: 20px; font-weight: 700; text-transform: uppercase; }
    .auth-sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 28px; }
    .auth-card .form-control { height: 48px; border-radius: 8px; border: 1.5px solid #e0e0e0; }
    .auth-card .form-control:focus { border-color: #ffc107; box-shadow: none; }
    .auth-card label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #555; }
    .auth-card .input-group-text { background: #f4f6f9; border: 1.5px solid #e0e0e0; border-right: none; height: 48px; }
    .auth-card .input-group .form-control { border-left: none; }
    .auth-card .input-group-append .btn { height: 48px; border: 1.5px solid #e0e0e0; border-left: none; background: #f4f6f9; }
    .btn-auth { height: 50px; font-weight: 700; border-radius: 8px; font-size: 15px; }
</style>

<div class="auth-wrapper">
    <div class="container">
        <div class="auth-card">
            <div class="auth-icon">
                <div class="icon-circle"><i class="fa fa-key"></i></div>
            </div>
            <div class="auth-title">Parol o'zgartirish</div>
            <div class="auth-sub">
                Salom, <strong>{{ user.username }}</strong>! Yangi parolingizni kiriting.
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Joriy parol</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa fa-lock text-warning"></i></span>
                        </div>
                        <input type="password" name="old_password" id="op"
                               class="form-control" placeholder="Joriy parolingiz" required>
                        <div class="input-group-append">
                            <button type="button" class="btn" onclick="t('op','e1')">
                                <i class="fa fa-eye" id="e1"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Yangi parol</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa fa-lock text-warning"></i></span>
                        </div>
                        <input type="password" name="new_password1" id="np1"
                               class="form-control" placeholder="Kamida 6 ta belgi" required>
                        <div class="input-group-append">
                            <button type="button" class="btn" onclick="t('np1','e2')">
                                <i class="fa fa-eye" id="e2"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Yangi parolni tasdiqlang</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fa fa-lock text-warning"></i></span>
                        </div>
                        <input type="password" name="new_password2" id="np2"
                               class="form-control" placeholder="Qayta kiriting"
                               required oninput="chk()">
                        <div class="input-group-append">
                            <button type="button" class="btn" onclick="t('np2','e3')">
                                <i class="fa fa-eye" id="e3"></i>
                            </button>
                        </div>
                    </div>
                    <small id="mt"></small>
                </div>

                <button type="submit" class="btn btn-warning btn-block btn-auth mt-2 font-weight-bold">
                    <i class="fa fa-save mr-2"></i>Parolni saqlash
                </button>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-block mt-2">
                    Bekor qilish
                </a>
            </form>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
function t(id, ico) {
    const i = document.getElementById(id), e = document.getElementById(ico);
    i.type = i.type==='password'?'text':'password';
    e.className = i.type==='text'?'fa fa-eye-slash':'fa fa-eye';
}
function chk() {
    const ok = document.getElementById('np1').value === document.getElementById('np2').value;
    const el = document.getElementById('mt');
    el.textContent = document.getElementById('np2').value ? (ok?'✔ Mos':'✘ Mos emas') : '';
    el.className = ok?'text-success':'text-danger';
}
</script>
{% endblock %}
{% endblock %}
